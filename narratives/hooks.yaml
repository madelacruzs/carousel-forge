# Hook formulas.
#
# These are patterns, not sentences. Fill every {slot} with something specific
# from the brief — a real number, a real topic, the reader's actual objection.
# A filled-in pattern that stays generic ("3 tips for success") is still a bad hook.
#
# An agent using skills/instagram-carousel/SKILL.md must propose three of these,
# filled in, and let the user choose before any other copy gets written.
#
# `example` shows what a properly specific fill looks like. Copy the specificity,
# not the words.
#
# The file is grouped by language: English formulas first, then Spanish ones with
# an `-es` suffix. A formula only detects headlines written in its own language,
# because `doctor` matches the literal words around each {slot} — an English
# pattern will never recognise a Spanish hook. Write the carousel in the language
# the audience reads, and pick the formula from that language's group.
#
# The pairs are siblings, not translations. Do not offer `mistake` and `mistake-es`
# as two of your three options; that is one idea presented twice.

- id: wish-i-knew
  pattern: '{n} things I wish I knew before {topic}'
  example: '4 things i wish i knew before renovating a 1920s kitchen'
  works_for: [educational, personal, retrospective]
  notes: Works because it is a confession, not a lecture. Use a real regret.

- id: perception-vs-reality
  pattern: 'what {they_see} vs. what {it_actually_is}'
  example: 'what the listing shows vs. what we found behind the drywall'
  works_for: [behind-the-scenes, personal, process]
  visual: split
  notes: Needs a split layout — two images, two labels. Pairs a polished shot with an honest one.

- id: mistake
  pattern: "you're doing {thing} wrong. here's why."
  example: "you're doing your lighting wrong. here's why."
  works_for: [educational, contrarian, technical]
  notes: Accusatory on purpose. Only use it if slide 2 immediately lets the reader off the hook.

- id: contrarian
  pattern: 'stop {common_advice}. {this} instead.'
  example: 'stop painting everything white. pick one warm neutral instead.'
  works_for: [contrarian, educational]
  notes: Requires that you actually disagree with the common advice. Fake contrarianism reads as bait.

- id: number-drop
  pattern: '{metric} in {timeframe}. without {obvious_shortcut}.'
  example: 'booked out 6 months in one year. without a single ad.'
  works_for: [results, case-study, business]
  notes: Only with a number you can defend. Naming the shortcut you did not take is what makes it credible.

- id: cost-of-inaction
  pattern: "{thing} is costing you {cost} and you can't see it"
  example: "your ceiling height is costing you every photo you take and you can't see it"
  works_for: [educational, business, persuasive]
  notes: The cost has to be one they already half-suspect. If it needs explaining, it is not a hook.

- id: insider-list
  pattern: '{n} {things} nobody tells you about {topic}'
  example: '5 costs nobody tells you about buying a heritage home'
  works_for: [educational, personal, industry]
  notes: '"nobody tells you" is a promise of access. Do not follow it with public knowledge.'

- id: question-direct
  pattern: 'why is {common_thing} so {unexpected_adjective}?'
  example: 'why is every rental kitchen so beige?'
  works_for: [educational, curiosity, technical]
  notes: Only works if the reader has genuinely wondered. Rhetorical questions they have not asked get scrolled.

- id: before-after
  pattern: "{before_state} → {after_state}. here's what changed."
  example: "empty shell → booked every weekend. here's what changed."
  works_for: [transformation, case-study, personal]
  visual: split
  notes: The gap between the two states is the whole hook. If it is small, pick another formula.

- id: permission
  pattern: "you're allowed to {thing_they_think_is_not_allowed}"
  example: "you're allowed to leave a room unfinished for a year"
  works_for: [personal, mindset, community]
  notes: Names a rule the audience has internalised and quietly resents. Get the rule wrong and it lands as nothing.

- id: time-stamped
  pattern: '{duration} after {event}, here is what i know'
  example: 'eight years after landing, here is what i know'
  works_for: [personal, retrospective, migration]
  notes: >-
    The exact duration is the hook. "eight years" earns a read that "a few years"
    does not, because only someone who lived it counts that precisely. Never round
    the number to make the line scan better — you are trading away the credibility
    that made the hook work.

# --- Fórmulas en español ----------------------------------------------------
#
# Latin American register: tuteo, never "vosotros". Lowercase, because these are
# spoken lines, not headlines. Accents and ¿ ¡ are part of the word — the cached
# font subsets cover á é í ó ú ñ ¿ ¡, so there is never a reason to drop them.

- id: ojala-hubiera-sabido-es
  pattern: '{n} cosas que ojalá me hubieran dicho antes de {topic}'
  example: 'ocho cosas que ojalá me hubieran dicho antes de migrar'
  works_for: [educational, personal, retrospective, migration]
  notes: >-
    Confesión, no clase. Funciona porque admite que te equivocaste. Si la lista
    resulta ser consejo genérico que cualquiera daría, la fórmula no te salva.

- id: lo-que-ves-vs-lo-que-es-es
  pattern: 'lo que {they_see} vs. lo que {it_is}'
  example: 'lo que ves vs. lo que es'
  works_for: [behind-the-scenes, personal, process, migration]
  visual: split
  notes: >-
    Necesita layout split — dos fotos, dos etiquetas. La foto bonita va primero y
    la honesta después. Si la segunda no incomoda un poco, no hay contraste.

- id: error-es
  pattern: 'estás {thing} mal. y no es tu culpa.'
  example: 'estás buscando trabajo mal. y no es tu culpa.'
  works_for: [educational, contrarian, technical, migration]
  notes: >-
    Acusa y absuelve en la misma línea. La segunda mitad no es decoración: sin
    ella el lector se defiende en vez de seguir leyendo. El slide 2 tiene que
    explicar de quién sí es la culpa.

- id: deja-de-es
  pattern: 'deja de {common_advice}. {this} en su lugar.'
  example: 'deja de aplicar a cien vacantes. escríbele a cinco personas en su lugar.'
  works_for: [contrarian, educational]
  notes: >-
    Solo si de verdad no estás de acuerdo con el consejo común. El contrarianismo
    fingido se huele y te cuesta la audiencia que ya te creía.

- id: dato-duro-es
  pattern: '{metric} en {timeframe}. sin {obvious_shortcut}.'
  example: 'tres trabajos en ocho años. sin una sola referencia canadiense al empezar.'
  works_for: [results, case-study, business, migration]
  notes: >-
    Solo con un número que puedas defender si te lo discuten en comentarios.
    Nombrar el atajo que no tomaste es lo que lo hace creíble.

- id: te-esta-costando-es
  pattern: '{thing} te está costando {cost} y no lo ves'
  example: 'traducir tu cv literal te está costando entrevistas y no lo ves'
  works_for: [educational, persuasive, migration]
  notes: >-
    El costo tiene que ser uno que el lector ya medio sospecha. Si hay que
    explicárselo, no es hook, es slide 3.

- id: nadie-te-cuenta-es
  pattern: '{n} {things} que nadie te cuenta de {topic}'
  example: 'cinco costos que nadie te cuenta de tu primer año en canadá'
  works_for: [educational, personal, industry, migration]
  notes: >-
    "nadie te cuenta" promete acceso. No lo sigas con información que sale en
    la primera página de Google, porque el lector la reconoce al instante.

- id: por-que-es-tan-es
  pattern: '¿por qué {common_thing} es tan {unexpected_adjective}?'
  example: '¿por qué hacer amigos aquí es tan lento?'
  works_for: [educational, curiosity, migration]
  notes: >-
    Solo sirve si el lector ya se lo preguntó solo. Abre con ¿ — sin el signo de
    apertura la línea se lee como afirmación hasta el final.

- id: antes-despues-es
  pattern: '{before_state} → {after_state}. esto es lo que cambió.'
  example: 'sin una sola referencia → equipo propio. esto es lo que cambió.'
  works_for: [transformation, case-study, personal, migration]
  visual: split
  notes: >-
    La distancia entre los dos estados es todo el hook. Si es corta, usa otra
    fórmula en vez de exagerar el punto de partida.

- id: tienes-permiso-es
  pattern: 'tienes permiso de {thing_they_think_is_not_allowed}'
  example: 'tienes permiso de extrañar y de quedarte al mismo tiempo'
  works_for: [personal, mindset, community, migration]
  notes: >-
    Nombra una regla que la audiencia se tragó y resiente en silencio. Es la
    fórmula más cálida de la lista y la que peor tolera el cinismo.

- id: anos-despues-es
  pattern: '{duration} después de {event}, esto es lo que sé'
  example: 'ocho años después de aterrizar, esto es lo que sé'
  works_for: [personal, retrospective, migration]
  notes: >-
    La cifra exacta es el hook. "ocho años" se gana una lectura que "unos años"
    no, porque solo quien lo vivió lleva la cuenta así. Nunca redondees el número
    para que la línea suene mejor: estás cambiando credibilidad por ritmo.
